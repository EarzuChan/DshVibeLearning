# Full-stack web overlay (host half + client half). The row uses the BARE
# package name so BOTH the host Loader and the client `modules` scanner resolve
# `dsh-vibe-learning` from the profile's node_modules (installed via
# `cd ~/.dsh/profiles/web && pnpm add <dvl-dir>`). The dev `cordis.yml` uses an
# absolute source path instead, which loads only the host half (tsx source
# launch) and is invisible to the client roster.
- insert:
    - id: dsh-vibe-learning
      name: dsh-vibe-learning
      config:
        port: 4182
        dataDir: '/Users/earzuchan/.dsh-vibe-learning'
